<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Count — Early number sense</title>
  <meta name="description" content="A calm, stage-by-stage path for early number sense." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=10" />
</head>
<body>
  <div class="field" aria-hidden="true"></div>

  <div id="app">
    <section id="screen-home" class="screen active" aria-label="Home">
      <header class="hero">
        <p class="brand">Count</p>
        <div class="hero-art" aria-hidden="true">
          <svg class="mark" viewBox="0 0 320 200" fill="none">
            <circle cx="96" cy="108" r="54" stroke="currentColor" stroke-width="1.25" opacity="0.35"/>
            <circle cx="168" cy="108" r="54" stroke="currentColor" stroke-width="1.25" opacity="0.55"/>
            <circle cx="240" cy="108" r="54" stroke="currentColor" stroke-width="1.25" opacity="0.8"/>
            <line x1="40" y1="108" x2="280" y2="108" stroke="currentColor" stroke-width="1" opacity="0.25"/>
            <text x="168" y="118" text-anchor="middle" font-family="Instrument Serif, serif" font-size="42" fill="currentColor">3</text>
          </svg>
        </div>
        <div class="cta-row home-cta">
          <button type="button" class="btn-play" id="btn-play" aria-label="Play">
            <svg viewBox="0 0 24 24" width="36" height="36" aria-hidden="true"><path fill="currentColor" d="M8 5.5v13l11-6.5L8 5.5z"/></svg>
          </button>
          <button type="button" class="btn-round" id="btn-sound" aria-label="Sound" aria-pressed="true">
            <svg class="ico-on" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M4 9v6h3l5 4V5L7 9H4zm11.5 3a3.5 3.5 0 0 0-1.5-2.9v5.8A3.5 3.5 0 0 0 15.5 12zm0-7v2a6 6 0 0 1 0 10v2c3.3-1 5.5-4 5.5-7s-2.2-6-5.5-7z"/></svg>
            <svg class="ico-off" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" hidden><path fill="currentColor" d="M4 9v6h3l5 4V5L7 9H4zm12.5 1.5 1.4-1.4 1.4 1.4 1.4-1.4-1.4-1.4 1.4-1.4-1.4-1.4-1.4 1.4-1.4-1.4-1.4 1.4 1.4 1.4-1.4 1.4 1.4 1.4z"/></svg>
          </button>
        </div>
      </header>
    </section>

    <section id="screen-intro" class="screen" aria-label="Stage intro" hidden>
      <div class="panel intro-card">
        <div class="stage-dots" id="intro-dots" aria-hidden="true"></div>
        <div class="intro-visual" id="intro-visual" aria-hidden="true"></div>
        <button type="button" class="btn-play" id="btn-intro-go" aria-label="Continue">
          <svg viewBox="0 0 24 24" width="36" height="36" aria-hidden="true"><path fill="currentColor" d="M8 5.5v13l11-6.5L8 5.5z"/></svg>
        </button>
      </div>
    </section>

    <section id="screen-game" class="screen" aria-label="Playing" hidden>
      <div class="topbar">
        <button type="button" class="icon-btn" data-go="home" aria-label="Home">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M15.4 4.6 8 12l7.4 7.4 1.4-1.4L10.8 12l6-6-1.4-1.4z"/></svg>
        </button>
        <div class="stage-pips" id="stage-pips" aria-hidden="true"></div>
        <div class="score" id="game-stars" aria-live="polite">0</div>
      </div>
      <div class="how" id="game-cue" aria-hidden="true"></div>
      <p class="prompt sr-only" id="game-prompt"></p>
      <p class="sr-only" id="game-title"></p>
      <p class="sr-only" id="stage-sub"></p>
      <div id="game-stage" class="game-stage"></div>
      <div class="feedback" id="feedback" aria-live="assertive"></div>
      <div class="progress" aria-hidden="true"><div id="progress-bar"></div></div>
    </section>

    <section id="screen-done" class="screen" aria-label="Complete" hidden>
      <div class="panel done-panel">
        <div class="done-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="56" height="56"><path fill="currentColor" d="M9.2 16.6 4.8 12.2l1.4-1.4 3 3 8-8 1.4 1.4-9.4 9.4z"/></svg>
        </div>
        <p class="done-score" id="done-score">0</p>
        <p class="sr-only" id="done-title">Complete</p>
        <p class="sr-only" id="done-msg"></p>
        <div class="cta-row home-cta">
          <button type="button" class="btn-play" id="btn-again" aria-label="Play again">
            <svg viewBox="0 0 24 24" width="32" height="32" aria-hidden="true"><path fill="currentColor" d="M12 5V1L7 6l5 5V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
          </button>
        </div>
      </div>
    </section>
  </div>

  <script src="game.js?v=10"></script>
</body>
</html>
